// Show only what has not finished. Persisted per device, same as the view
// mode: a phone set to hide settled matches stays that way between visits.
let upcoming=localStorage.getItem('upcomingOnly')==='1';
function setUpcoming(v){upcoming=v;localStorage.setItem('upcomingOnly',v?'1':'0');render();}
function rankView(){
  const R=DATA.rank||{}, cur=R.current, weeks=R.weeks||[], TOT=R.total_weeks||38;
  const head=`<div style="margin:26px 0 16px"><h2 class="bg" style="font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0">Ranking</h2><div style="font:500 13px 'Hanken Grotesk';color:#8A909C;margin-top:4px">My position across the whole Prode app${weeks.length?', week by week':''}</div></div>`;
  const pct=(p,nn)=>'top '+Math.max(0.01,Math.round(p/nn*10000)/100)+'%';
  // NOTHING is claimed without a position - there is simply no answer yet.
  if(!weeks.length&&!cur) return header()+head+`<section class="card" style="padding:40px 26px;text-align:center"><div style="font-size:36px">\u23F3</div><p style="max-width:430px;margin:12px auto 0;font:400 15px/1.65 'Hanken Grotesk';color:#565B66">The ranking appears once Prode has scored a position. Position is measured across <b>all Prode players</b>, matchweek by matchweek, ${TOT} weeks in the season.</p></section>`;
  // NO COMPLETED WEEK YET (his ask, 2026-08-23). The week-by-week line needs a
  // round where EVERY fixture is finished, and La Liga defers R1 matches for
  // weeks - so on 23 Aug, eleven matches in and 9 points scored, this tab still
  // showed an hourglass while `current` sat right there in the payload saying
  // #210 of 2,275. A page that hides what it already knows is worse than one
  // that says "early days". The Django hub shows the live standing; so does this
  // now, labelled RIGHT NOW so it is never mistaken for a scored matchweek.
  //
  // THE BAR, not a bell curve (his pick, 2026-08-23, option 5 of 10). A curve
  // would have to assume a shape for the field - Prode scores are not normal,
  // they are skewed with a lump at zero - and drawing an idealised bell behind a
  // real marker publishes an assumption as if it were data. A line from last to
  // first assumes nothing: the only claim is where he sits on it, and that is
  // measured. The percentage rides WITH the pin rather than sitting centred,
  // because a label at 50% pointing at a mark at 91% is a chart arguing with
  // itself.
  if(!weeks.length){
    const pc = Math.max(0, Math.min(100, (1 - cur.position/cur.players) * 100));
    const lab = Math.max(4, Math.min(96, pc));   // keep the label off both edges
    return header()+head+`<section class="card" style="background:linear-gradient(160deg,#151b23,#1d2733);padding:28px 18px 26px;text-align:center">
      <div class="mono" style="font-weight:800;font-size:clamp(30px,9vw,44px);color:#2BD98A;line-height:1">#${Number(cur.position).toLocaleString()}</div>
      <div style="font:600 14px 'Hanken Grotesk';color:#aeb6c2;margin-top:6px">of ~${Number(cur.players).toLocaleString()}</div>
      ${bar(cur.position,cur.players)}
      <div style="font:700 11px 'Hanken Grotesk';letter-spacing:.14em;color:#7c8494;margin-top:16px">ALL PRODE \u00b7 RIGHT NOW</div>
      <div style="display:flex;justify-content:center;gap:26px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)">
        <div><div class="mono" style="font-weight:800;font-size:20px;color:#fff">${cur.points}</div><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#7c8494;margin-top:2px">POINTS</div></div>
        <div><div class="mono" style="font-weight:800;font-size:20px;color:#fff">${cur.exacts}</div><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#7c8494;margin-top:2px">EXACT</div></div>
        <div><div class="mono" style="font-weight:800;font-size:20px;color:#fff">${cur.played}</div><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#7c8494;margin-top:2px">PLAYED</div></div>
      </div>
    </section>
    <section class="card" style="padding:22px 18px;text-align:center"><p style="max-width:430px;margin:0 auto;font:400 14px/1.6 'Hanken Grotesk';color:#565B66">The week-by-week line starts once a full matchweek is scored \u2014 every fixture in the round finished. ${TOT} weeks in the season.</p></section>`;
  }
  const last=weeks[weeks.length-1];
  // THE WEEK TABLE (his spec, 2026-08-23): date, matches played, the ranking at
  // the end of that week, and the move. Weeks are REAL calendar weeks - season
  // start plus seven days - because a Prode "matchweek" is a round, and a round
  // is not a week: La Liga defers R1 fixtures for a fortnight, so rounds overlap
  // and one can straddle three of them. See the loader for why `kickoff` and not
  // `actual_at` decides which week a match belongs to.
  const hero=`<section class="card" style="background:linear-gradient(160deg,#151b23,#1d2733);padding:28px 18px 26px;margin:0 0 18px;text-align:center">
    <div class="mono" style="font-weight:800;font-size:clamp(30px,9vw,44px);color:#2BD98A;line-height:1">#${Number(last.position).toLocaleString()}</div>
    <div style="font:600 14px 'Hanken Grotesk';color:#aeb6c2;margin-top:6px">of ~${Number(last.players).toLocaleString()}</div>
    ${bar(last.position,last.players)}
    <div style="font:700 11px 'Hanken Grotesk';letter-spacing:.14em;color:#7c8494;margin-top:16px">ALL PRODE \u00b7 ${last.open?'WEEK '+last.week+' SO FAR':'AFTER WEEK '+last.week}</div>
    <div style="display:flex;justify-content:center;gap:26px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)">
      <div><div class="mono" style="font-weight:800;font-size:20px;color:#fff">${last.points??0}</div><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#7c8494;margin-top:2px">POINTS</div></div>
      <div><div class="mono" style="font-weight:800;font-size:20px;color:#fff">${last.exacts??0}</div><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#7c8494;margin-top:2px">EXACT</div></div>
      <div><div class="mono" style="font-weight:800;font-size:20px;color:#fff">${weeks.reduce((a,h)=>a+(h.played||0),0)}</div><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#7c8494;margin-top:2px">PLAYED</div></div>
    </div></section>`;
  // A move is only shown where there is a previous week to move FROM, and the
  // arrow is never colour-alone - the number and the glyph both carry it.
  const move=h=>{
    if(h.diff===null||h.diff===undefined) return `<span style="color:#b1b6bf">\u2014</span>`;
    if(h.diff===0) return `<span style="color:#8A909C">\u2013 0</span>`;
    const up=h.diff>0;
    return `<span style="color:${up?'#0BA15B':'#e8392e'};font-weight:700">${up?'\u25B2':'\u25BC'} ${Math.abs(h.diff).toLocaleString()}</span>`;
  };
  const row=h=>`<div style="display:grid;grid-template-columns:96px 54px 1fr 76px;gap:8px;align-items:baseline;padding:11px 12px;border-top:1px solid rgba(20,23,28,.06)">
    <span style="font:600 12px 'Hanken Grotesk';color:#16181D;white-space:nowrap">${h.label}${h.open?`<span style="color:#8A909C;font-weight:500"> · open</span>`:''}</span>
    <span class="mono" style="color:#565B66">${h.played}</span>
    <span class="mono" style="font-weight:700;color:#16181D">#${Number(h.position).toLocaleString()}</span>
    <span class="mono" style="text-align:right">${move(h)}</span></div>`;
  const hd=`<div style="display:grid;grid-template-columns:96px 54px 1fr 76px;gap:8px;padding:0 12px 10px;font:600 9px 'Hanken Grotesk';letter-spacing:.09em;text-transform:uppercase;color:#b1b6bf"><span>Week</span><span>Played</span><span>Rank</span><span style="text-align:right">Move</span></div>`;
  const foot=`<p style="font:400 12px/1.55 'Hanken Grotesk';color:#8A909C;margin:14px 14px 2px">Real calendar weeks from the season start, seven days each \u2014 not Prode rounds, which overlap. Rank is your position across all Prode players at the end of that week.</p>`;
  return header()+head+hero+`<section class="card" style="padding:16px 6px 8px">${hd}${weeks.map(row).join('')}${foot}</section>`;
}

// The percentile bar, shared by the no-weeks card and the hero above, so both
// place the pin by the same rule and neither can drift from the other.
function bar(position,players){
  const pc=Math.max(0,Math.min(100,(1-position/players)*100));
  const lab=Math.max(4,Math.min(96,pc));
  return `<div style="margin:22px 6px 0;position:relative;padding-top:28px">
    <div style="height:12px;border-radius:99px;background:linear-gradient(90deg,#2c3440,#3b4756 55%,#2BD98A)"></div>
    <div style="position:absolute;top:0;left:${lab}%;transform:translateX(-50%);text-align:center">
      <div style="font:700 11px 'Hanken Grotesk';color:#2BD98A;white-space:nowrap">top ${Math.max(0.01,Math.round(position/players*10000)/100)}%</div>
      <div style="width:4px;height:24px;background:#fff;border-radius:2px;box-shadow:0 0 0 3px rgba(21,27,35,.92);margin:3px auto 0"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:11px">
      <span style="font:600 10px 'Hanken Grotesk';color:#7c8494">#${Number(players).toLocaleString()}</span>
      <span style="font:600 10px 'Hanken Grotesk';color:#7c8494">#1</span>
    </div></div>`;
}

function countdown(){
  const start=new Date(CFG.starts+'T12:00:00Z'), ms=start-new Date();
  if(ms<=0) return 'Season under way';
  const d=Math.floor(ms/864e5);
  return `Kicks off ${new Date(CFG.starts+'T12:00:00Z').toLocaleDateString(undefined,{day:'numeric',month:'long'})} · ${d} day${d===1?'':'s'} to go`;
}

function statusChip(m){
  // ONE rule, his spec: green only when every pipeline step is green, else red.
  // The old chip had four glyphs and an amber tier; amber is gone entirely.
  if(pipeOk(m)) return `<span title="Fetched \u00b7 placed \u00b7 verified" style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:#0BA15B;color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:800">\u2713</span>`;
  const bad=pipeline(m).filter(st=>!st.ok).map(st=>st.label+': '+st.why).join(' \u00b7 ');
  return `<span title="${esc(bad)}" style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:#e8392e;color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:800">\u2717</span>`;
}
function pipeline(m){
  const fetched = m.basis==='market';
  const placed  = !!m.placed;
  const match   = placed && !!m.pick && m.placed===m.pick;
  const whyNoOdds = m.csRead==='failed' ? 'our last read failed'
                  : m.csRead==='unchecked' ? 'not checked yet'
                  : 'no market posted yet';
  return [
    {label:'Odds fetched',    ok:fetched, why:fetched?(m.synced?'fetched '+m.synced+' GST':'posted market read'):whyNoOdds},
    {label:'Placed on Prode', ok:placed,  why:placed?('holds '+m.placed):'nothing entered'},
    {label:'Verified',        ok:match,   why:match?'entry matches the model pick'
                                             :(placed&&m.pick?('Prode '+m.placed+' \u2260 model '+m.pick)
                                             :'waiting on steps 1\u20132')},
  ];
}
function pipeOk(m){ return pipeline(m).every(st=>st.ok); }

function pipelineCard(m){
  const steps=pipeline(m);
  const node=(st,idx)=>`
    <div style="flex:1;min-width:0;text-align:center">
      <div style="display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;background:${st.ok?'#0BA15B':'#e8392e'};box-shadow:0 0 0 4px ${st.ok?'rgba(11,161,91,.14)':'rgba(232,57,46,.14)'}">${st.ok?'\u2713':'\u2717'}</div>
      <div style="font:700 12px 'Hanken Grotesk';margin-top:7px;color:#16181D">${idx+1} \u00b7 ${st.label}</div>
      <div style="font:500 11px 'Hanken Grotesk';margin-top:2px;color:${st.ok?'#8A909C':'#c22d23'}">${esc(st.why)}</div>
    </div>`;
  const bar=(a,b)=>`<div style="flex:0 0 clamp(14px,4vw,46px);height:3px;border-radius:99px;margin-top:16px;background:${a.ok&&b.ok?'#0BA15B':'rgba(20,23,28,.12)'}"></div>`;
  return `<section class="card" style="padding:20px 14px 16px;margin-bottom:16px">
    <div style="display:flex;align-items:flex-start;justify-content:center">
      ${node(steps[0],0)}${bar(steps[0],steps[1])}${node(steps[1],1)}${bar(steps[1],steps[2])}${node(steps[2],2)}
    </div>
  </section>`;
}

// Club crest by URL (referenced, not copied) with the tri-code chip as automatic fallback
// if the image is missing or fails to load.
function badge(cod,logo,sz){
  sz=sz||22;
  if(!logo) return `<span class="cod">${esc(cod)}</span>`;
  return `<img src="${esc(logo)}" alt="${esc(cod)}" title="${esc(cod)}" class="crest" loading="lazy" style="width:${sz}px;height:${sz}px" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'"><span class="cod" style="display:none">${esc(cod)}</span>`;
}
// Result | Pred, same two-column shape as the World Cup card. `rv` is the actual score once
// played (null pre-season -> an em-dash placeholder), `pv` our predicted digit.
const _RG='1fr 50px 50px';
function _cell(v,pred){
  return `<span class="mono" style="text-align:center;font-weight:700;font-size:18px;color:${v==null?'#d8dbe1':(pred?'var(--posInk)':'#16181D')};${pred?'border-left:1px solid rgba(20,23,28,.1)':''}">${v==null?'–':v}</span>`;
}
function rowHead(){
  return `<div style="display:grid;grid-template-columns:${_RG};gap:6px;padding:2px 0 4px">
    <span></span>
    <span style="font:600 9px 'Hanken Grotesk';letter-spacing:.07em;color:#b1b6bf;text-transform:uppercase;text-align:center">Result</span>
    <span style="font:600 9px 'Hanken Grotesk';letter-spacing:.07em;color:#b1b6bf;text-transform:uppercase;text-align:center;border-left:1px solid rgba(20,23,28,.1)">Pred</span></div>`;
}
function trow(cod,logo,nm,pv,rv){
  return `<div style="display:grid;grid-template-columns:${_RG};gap:6px;align-items:center;padding:7px 0">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">${badge(cod,logo)}<span style="font:700 15px 'Hanken Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(nm)}</span></div>
    ${_cell(rv==null?null:rv,false)}${_cell(pv,true)}</div>`;
}

function mcard(m){
  const pk=m.revealed&&m.pick?m.pick.split('-'):[null,null];
  // THE RESULT COLUMN. Both rows used to be handed `null` here, so the column
  // existed, was labelled, and could never fill -- every played match read "—"
  // under a "Result" heading. Not gated on `revealed`: a final score is a
  // public fact about a match that has already happened, and it only exists
  // after kick-off in the first place.
  const rs=m.result?String(m.result).split('-'):[null,null];
  // ONCE IT IS PLAYED, THE FOOTER SHOWS WHAT IT SCORED, NOT WHAT IT EXPECTED.
  // EV is a forecast, and a forecast on a settled match is the one number that
  // can no longer be acted on or judged — the points are the answer it was
  // predicting. This is how the WC26 archive did it all tournament (same
  // footer, "Points" in place of "EV", green when it scored and grey when it
  // did not), and that site ran a full competition to joint 1st, so the
  // pattern is copied rather than reinvented.
  //
  // `!= null` and not a truthiness test: nought points is a RESULT — the pick
  // missed — and it must show as 0, not fall through to the EV branch.
  // NOT COUNTED: Prode played this fixture outside its scheduled matchday, so
  // it scores nothing however right the pick was (their rules, section 3 —
  // docs/prode-rules-game-mode.md). Without saying so, an exact hit showing 0
  // points looks like a bug in our own scoring to the one person who checked.
  const notCounted = m.not_counted
    ? `<span title="Played outside its scheduled matchday — Prode does not count it" style="font:600 9px 'Hanken Grotesk';letter-spacing:.06em;text-transform:uppercase;color:#8A909C;border:1px solid rgba(20,23,28,.14);border-radius:5px;padding:2px 6px;margin-right:auto">Not counted</span>`
    : '';
  const foot = m.pts != null
    ? `<div style="display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:6px;padding-top:10px;border-top:1px solid rgba(20,23,28,.06)">${notCounted}<span style="font:600 10px 'Hanken Grotesk';color:#8A909C;text-transform:uppercase;letter-spacing:.06em">Points</span><span class="mono" style="font-weight:700;font-size:17px;color:${m.pts>0?'var(--posInk)':'#9aa0ab'}">${m.pts}</span></div>`
    // Still being played: the score above is real but running, and it has
    // earned nothing yet. Said out loud, because a score with no points beside
    // it otherwise reads as a match we forgot to settle.
    : m.status==='live'
    ? `<div style="display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:6px;padding-top:10px;border-top:1px solid rgba(20,23,28,.06)"><span style="font:700 10px 'Hanken Grotesk';color:#e8392e;text-transform:uppercase;letter-spacing:.06em">● Live</span><span style="font:500 11px 'Hanken Grotesk';color:#8A909C">score not final</span></div>`
    : m.revealed
    ? `<div style="display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:6px;padding-top:10px;border-top:1px solid rgba(20,23,28,.06)"><span style="font:600 10px 'Hanken Grotesk';color:#8A909C;text-transform:uppercase;letter-spacing:.06em">EV</span><span class="mono" style="font-weight:700;font-size:17px;color:var(--posInk)">${m.ev!=null?m.ev.toFixed(2):'—'}</span></div>`
    : (m.locked
        ? `<div style="display:flex;justify-content:center;align-items:center;gap:7px;margin-top:8px;padding-top:9px;border-top:1px solid rgba(20,23,28,.06);font:600 11px 'Hanken Grotesk';color:#9aa0ab">🔒 Pick unlocks at kick-off</div>`
        : `<div style="display:flex;justify-content:center;margin-top:8px;padding-top:9px;border-top:1px solid rgba(20,23,28,.06);font:600 11px 'Hanken Grotesk';color:#c2c6cd">Opens with the matchweek</div>`);
  return `<div onclick="location.hash='#/m/${m.id}'" class="card" style="padding:14px 17px;cursor:pointer">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;margin-bottom:2px;border-bottom:1px solid rgba(20,23,28,.07)">
      <div style="font:600 12px 'Hanken Grotesk';color:#565B66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b style="color:#16181D">${esc(m.ref||m.round)}</b> · ${esc(m.kd)} · ${esc(m.kt)}</div>${statusChip(m)}</div>
    ${rowHead()}${trow(m.hC,m.hLogo,m.hN,pk[0],rs[0])}${trow(m.aC,m.aLogo,m.aN,pk[1],rs[1])}${foot}</div>`;
}

function home(){
  const s=DATA.summary||{total:DATA.matches.length,rounds:CFG.rounds,played:0,points:0,forecast:0};
  const start=new Date(CFG.starts+'T12:00:00Z'), _ms=start-new Date();
  const _days=Math.max(0,Math.floor(_ms/864e5)), _live=_ms<=0||s.played>0;
  const _dstr=start.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'long'});
  // THE BANNER IS A COUNTDOWN, SO IT ENDS WHEN THE COUNTDOWN DOES.
  // It used to stay forever, turning into "Season under way" — a headline that
  // says nothing a visitor cannot see from the fixtures under it, taking the
  // best space on the page all season. Now it is only rendered while there is
  // still something to count down to, and it removes ITSELF at the season's
  // start date: no edit, no flag, no second visit needed. La Liga's has gone
  // (started 15 Aug); the Premier League's stays until the 21st and then goes
  // the same way.
  const cd=_live?'':`<section class="card" style="padding:18px 22px;margin:24px 0 14px;display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 9%,#fff),#fff);border-left:4px solid var(--acc)">
      <div style="text-align:center;flex:none;min-width:60px"><div class="bg" style="font-weight:800;font-size:38px;line-height:1;color:var(--accInk)">${_days}</div><div class="lab" style="margin-top:4px">days to go</div></div>
      <div style="flex:1;min-width:0"><div class="bg" style="font-weight:700;font-size:19px;letter-spacing:-.01em">${'Kicks off '+_dstr}</div><div style="font:500 13px 'Hanken Grotesk';color:#8A909C;margin-top:3px">${s.total} fixtures · ${s.rounds} matchweeks</div></div></section>`;
  const _tile=(v,l,acc)=>`<div style="flex:1;text-align:center;padding:16px 6px;border-left:1px solid rgba(20,23,28,.07)"><div class="mono" style="font-weight:700;font-size:clamp(19px,4.6vw,25px);white-space:nowrap;color:${acc==='pos'?'var(--posInk)':(acc?'var(--accInk)':'#16181D')}">${v}</div><div class="lab" style="margin-top:6px">${l}</div></div>`;
  const tiles=`<section class="card" style="display:flex;padding:6px 0;margin:0 0 20px"><div style="flex:1;text-align:center;padding:16px 6px"><div class="mono" style="font-weight:700;font-size:clamp(19px,4.6vw,25px);white-space:nowrap;color:#16181D">${s.points}</div><div class="lab" style="margin-top:6px">total points</div></div>${_tile(s.played+'/'+s.total,'matches played',false)}${_tile(s.forecast,'points forecast','pos')}</section>`;
  const searching=q.length>0;
  let list=DATA.matches.slice();
  if(round!=='ALL' && !searching) list=list.filter(m=>('R'+m.roundNo)===round);
  if(searching) list=list.filter(m=>(m.hN+' '+m.aN+' '+m.hC+' '+m.aC).toLowerCase().includes(q));
  // 'finished' is the only settled state -- a LIVE match is deliberately kept:
  // it has not scored yet, its Pts cell still reads '?', and it is the one
  // fixture most worth having in front of you.
  if(upcoming) list=list.filter(m=>m.status!=='finished');
  const weekOpts=[`<option value="ALL"${round==='ALL'?' selected':''}>All matchweeks · ${DATA.matches.length} matches</option>`].concat(DATA.rounds.map(r=>`<option value="${r.key}"${r.key===round?' selected':''}>Matchweek ${r.no} · ${r.count} matches</option>`)).join('');
  const weekSelect=`<div style="position:relative;flex:1;min-width:0"><select onchange="pick(this.value)" style="width:100%;padding:13px 28px 13px 13px;border:1px solid rgba(20,23,28,.14);border-radius:13px;font:600 13px 'Hanken Grotesk';color:#16181D;background:#fff;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none">${weekOpts}</select><span style="position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:#8A909C;font-size:11px">▾</span></div>`;
  const rnd=round==='ALL'||searching?'All matches':(DATA.rounds.find(r=>r.key===round)||{}).long;
  const head=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><h2 class="bg" style="font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0">${esc(rnd)}</h2><span style="font:600 12px 'Hanken Grotesk';color:#9aa0ab">${list.length} match${list.length===1?'':'es'}</span></div>`;
  const box=`<div style="position:relative;margin:0 0 18px"><input id="q" value="${esc(q)}" oninput="search(this.value)" placeholder="🔍  Search a club" autocomplete="off" style="width:100%;padding:13px 16px;border:1px solid rgba(20,23,28,.14);border-radius:13px;font:500 15px 'Hanken Grotesk';outline:none;background:#fff">${searching?`<span onclick="search('')" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#9aa0ab">✕</span>`:''}</div>`;
  const grid=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:15px">${list.map(mcard).join('')||`<div class="card" style="padding:36px;text-align:center;color:#9aa0ab">No matches.</div>`}</div>`;
  // ---- his compact table: narrow rows — date · crests + tri-codes · one mark.
  // Whole row is a link to the match page; the mark is the SAME pipeOk verdict
  // as the tile chip, so the two views can never disagree about a match.
  // ONE definition of the column track, used by the header and by every row.
  // Kept as a constant because two copies drift: a header a column out of step
  // with its data is worse than no header, and nothing warns you it happened.
  const TCOLS='44px 1fr auto 20px 30px';
  // WHAT THE PICK EARNED, in one glyph or two.
  //
  //   +3 / +1   Prode's scoring: exact score, then correct outcome.
  //   0         played, counted, earned nothing.
  //   X         played OUTSIDE its scheduled matchday. Prode scores those
  //             nothing however right the pick was (its rules, section 3), so
  //             a bare 0 here would read as a scoring bug to anyone who knows
  //             the score. `not_counted` is Prode's own verdict, not ours.
  //   ?         no result yet -- upcoming, or still in play.
  //
  // Read from the SAME record the tile view reads, so the two can never
  // disagree about what a match scored.
  const ptsCell=m=>{
    let t='?',c='#c3c7cf',ti='Not played yet';
    if(m.not_counted){t='X';c='#9aa0ab';ti='Played outside its matchday — scores nothing';}
    else if(m.status==='finished'&&m.pts!=null){
      t=m.pts>0?('+'+m.pts):'0';
      c=m.pts>0?'#0BA15B':'#9aa0ab';
      ti=m.pts+' point'+(m.pts===1?'':'s');
    }
    return `<span class="mono" title="${ti}" style="font-size:11px;font-weight:800;color:${c};text-align:right">${t}</span>`;
  };
  const trow2=m=>{
    const okk=pipeOk(m);
    const d=(m.kd||'').replace(/^\w+ /,'');
    // crest = decoration ONLY: on load failure it VANISHES instead of falling
    // back to a tri-code chip — the chip PLUS the text code doubled every club
    // ("ATH ATH v SEV SEV") whenever the crest CDN was slow or blocked.
    const cr=(logo)=>logo?`<img src="${esc(logo)}" alt="" loading="lazy" style="width:15px;height:15px;flex:none" onerror="this.style.display='none'">`:'';
    return `<a href="#/m/${m.id}" style="display:grid;grid-template-columns:${TCOLS};gap:7px;align-items:center;padding:4px 9px;border-top:1px solid rgba(20,23,28,.06);color:inherit;min-height:30px">
      <span class="mono" style="font-weight:600;font-size:10px;color:#8A909C;white-space:nowrap">${esc(d)}</span>
      <span style="display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap">
        ${cr(m.hLogo)}<span class="mono" style="font-weight:700;font-size:12px">${esc(m.hC)}</span>
        <span style="color:#c3c7cf;font-size:10px">v</span>
        ${cr(m.aLogo)}<span class="mono" style="font-weight:700;font-size:12px">${esc(m.aC)}</span>
      </span>
      <span class="mono" style="font-size:11px;font-weight:700;color:var(--posInk)">${m.revealed&&m.pick?esc(m.pick):''}</span>
      <span style="display:inline-flex;width:14px;height:14px;border-radius:50%;background:${okk?'#0BA15B':'#e8392e'};color:#fff;align-items:center;justify-content:center;font-size:8px;font-weight:800">${okk?'\u2713':'\u2717'}</span>${ptsCell(m)}
    </a>`;};
    // PICK, not result. The column holds the model's scoreline and only
  // after kick-off; beside a "+1" it read as the final score, which is the
  // confusion this header exists to end. "OK" is the three-step pipeline
  // verdict -- odds fetched, placed on Prode, entry matches the model.
  const thead=`<div style="display:grid;grid-template-columns:${TCOLS};gap:7px;align-items:center;padding:9px 9px 8px;border-bottom:1px solid rgba(20,23,28,.10);font:600 9px 'Hanken Grotesk';letter-spacing:.09em;text-transform:uppercase;color:#b1b6bf"><span>Date</span><span>Match</span><span>Pick</span><span title="Odds fetched, placed on Prode, and the two agree">OK</span><span style="text-align:right">Pts</span></div>`;
  const table=`<div class="card" style="overflow:hidden">${list.length?thead:''}${list.map(trow2).join('')||`<div style="padding:36px;text-align:center;color:#9aa0ab">No matches.</div>`}</div>`;
  const vbtn=(id,ic,tt)=>`<button onclick="setView('${id}')" title="${tt}" style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border:0;border-radius:7px;cursor:pointer;font-size:13px;background:${view===id?'var(--accInk)':'transparent'};color:${view===id?'#fff':'#8A909C'}">${ic}</button>`;
  // A 60px segmented ICON control on the heading row — the full-width bar it
  // replaces dominated desktop layouts ("very big on desktop", 2026-08-11).
  const vswitch=`<span style="display:inline-flex;gap:2px;background:rgba(20,23,28,.06);border-radius:9px;padding:2px;vertical-align:middle">${vbtn('tiles','\u25a6','Tiles')}${vbtn('table','\u2630','Table')}</span>`;
  const head2=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px"><h2 class="bg" style="font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0">${esc(rnd)}</h2><span style="display:inline-flex;align-items:center;gap:10px"><span style="font:600 12px 'Hanken Grotesk';color:#9aa0ab">${list.length} match${list.length===1?'':'es'}</span>${isMobile()?vswitch:''}</span></div>`;
  // The toggle sits on the dropdown's line, right -- and stays visible while
  // searching, when the dropdown does not. A filter whose control is hidden is
  // a filter nobody can see is on, and the empty list it produces looks like a
  // bug rather than a choice.
  // A SEGMENTED CONTROL, not a button. The first version was an accent-
  // filled block that read as a primary action ('not clear that it is
  // actually a filter or button', 2026-08-31) and hid its own second
  // state -- you could not tell what pressing it would do, or what it was
  // doing now. Two labelled halves with the live one filled says 'choose
  // one', and matches the view switch further down the page.
  const fbtn=(on,label)=>`<button onclick="setUpcoming(${on})" style="padding:0 9px;height:30px;border:0;border-radius:8px;cursor:pointer;font:600 11px 'Hanken Grotesk';white-space:nowrap;background:${upcoming===on?'var(--accInk)':'transparent'};color:${upcoming===on?'#fff':'#8A909C'}">${label}</button>`;
  const upSwitch=`<span title="Filter the list: every match, or only those that have not finished" style="display:inline-flex;gap:2px;flex:none;align-self:center;background:rgba(20,23,28,.06);border-radius:10px;padding:3px">${fbtn(false,'All')}${fbtn(true,'Upcoming')}</span>`;
  const weekRow=`<div style="display:flex;gap:8px;align-items:center;margin:0 0 20px">${searching?'':weekSelect}${upSwitch}</div>`;
  return header()+cd+tiles+box+weekRow+head2+((view==='table'&&isMobile())?table:grid);
}

function probBar(o){
  const H=Math.round((o.HOME||0)*100),D=Math.round((o.DRAW||0)*100),A=Math.round((o.AWAY||0)*100);
  const seg=(w,c,t)=>`<div style="width:${w}%;background:${c};display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px 'JetBrains Mono'">${w>=10?t:''}</div>`;
  return `<div style="max-width:560px;margin:20px auto 0"><div style="display:flex;height:30px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(20,23,28,.06)">${seg(H,'var(--acc)','1')}${seg(D,'#9aa0ab','X')}${seg(A,'#3a4150','2')}</div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font:700 12px 'JetBrains Mono'"><span class="acc">1 · ${H}%</span><span style="color:#8A909C">X · ${D}%</span><span style="color:#3a4150">2 · ${A}%</span></div>
  <div style="text-align:center" class="lab">Match result — win probability</div></div>`;
}

function detail(id){
  const m=byId(id); if(!m) return header()+'<p style="margin-top:30px">Not found. <a href="#/">Back</a></p>';
  const back=`<a href="#/" style="display:inline-flex;align-items:center;gap:7px;margin:24px 0 18px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> All matches</a>`;
  // Header carries the scoreline itself, in Result | Pred columns — same as the World Cup
  // detail page. No separate "recommendation" card: the ranked table below already gives the
  // pick's probability and expected points on its first row.
  const pk=m.revealed&&m.pick?m.pick.split('-'):[null,null];
  // See mcard(): the Result column was passed null on both rows here too, so
  // the match page showed a "Result" heading over two dashes forever.
  const rs=m.result?String(m.result).split('-'):[null,null];
  const dcell=(v,pred)=>`<span class="mono" style="text-align:center;font-weight:700;font-size:26px;color:${v==null?'#d8dbe1':(pred?'var(--posInk)':'#16181D')};${pred?'border-left:1px solid rgba(20,23,28,.1)':''}">${v==null?'–':v}</span>`;
  const dg='1fr 60px 60px';
  const drow=(cod,logo,nm,rv,pv)=>`<div style="display:grid;grid-template-columns:${dg};gap:10px;align-items:center;padding:12px 0;border-top:1px solid rgba(20,23,28,.06)"><div style="display:flex;align-items:center;gap:14px;min-width:0">${badge(cod,logo,32)}<span class="bg" style="font-weight:700;font-size:clamp(18px,3vw,23px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(nm)}</span></div>${dcell(rv,false)}${dcell(pv,true)}</div>`;
  const dhead=m.revealed?`<div style="display:grid;grid-template-columns:${dg};gap:10px;padding-bottom:2px"><span></span><span style="font:600 10px 'Hanken Grotesk';letter-spacing:.08em;color:#b1b6bf;text-transform:uppercase;text-align:center">Result</span><span style="font:600 10px 'Hanken Grotesk';letter-spacing:.08em;color:#b1b6bf;text-transform:uppercase;text-align:center;border-left:1px solid rgba(20,23,28,.1)">Pred</span></div>`:'';
  const headCard=`<section class="card" style="padding:22px clamp(18px,4vw,28px);margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><div style="font:600 13px 'Hanken Grotesk';color:#565B66"><b style="color:#16181D">${esc(m.ref||m.round)}</b> · ${esc(m.kd)} · ${esc(m.kt)}</div>${statusChip(m)}</div>
    ${dhead}${drow(m.hC,m.hLogo,m.hN,rs[0],pk[0])}${drow(m.aC,m.aLogo,m.aN,rs[1],pk[1])}
    ${m.revealed?probBar(m.out):''}</section>`;
  const syncedLine=m.synced?`<div style="text-align:center;font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#b1b6bf;text-transform:uppercase;margin:-6px 0 14px">⟳ odds fetched ${esc(m.synced)} GST</div>`:'';
  if(m.revealed) return header()+back+headCard+syncedLine+pipelineCard(m)+rankedTable(m);
  if(m.missing) return header()+back+headCard+pipelineCard(m)+`<section class="card" style="padding:34px;text-align:center;color:#8A909C"><p style="max-width:420px;margin:0 auto;line-height:1.6">No odds published for this fixture yet, so there is no ranked-scores table to show. It appears here as soon as a market opens.</p></section>`;
  if(m.locked) return header()+back+headCard+lockedCard();
  return header()+back+headCard+`<section class="card" style="padding:38px;text-align:center;color:#8A909C"><div style="font-size:32px">🗓️</div><p style="max-width:420px;margin:12px auto 0;line-height:1.6">This matchweek isn't open yet. The model publishes its pick and probabilities once the round's odds are live.</p></section>`;
}

// The World Cup site's block: every scoreline, ranked by expected points, with P(score),
// the EV number and a bar. This is the main content of a match page — not a summary tile.
function rankedTable(m){
  const R=m.ranked||[];
  if(!R.length) return '';
  const maxev=Math.max(...R.map(r=>r.ev));
  const gc='22px 1.1fr 1fr 1.3fr';
  const heads=['#','Score','P(score)','Exp. pts'];
  return `<section class="card" style="padding:24px 18px;margin-top:16px">
    <h3 class="bg" style="font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0 0 3px">Picks ranked by expected points</h3>
    <p style="font:500 12px 'Hanken Grotesk';color:#8A909C;margin:0 0 14px">Every scoreline, ranked by how many points it scores on average</p>
    <div style="display:grid;grid-template-columns:${gc};gap:9px;align-items:center;padding:0 10px 11px;border-bottom:1px solid rgba(20,23,28,.08)">${heads.map(h=>`<span style="font:600 9px 'Hanken Grotesk';letter-spacing:.09em;color:#b1b6bf;text-transform:uppercase">${h}</span>`).join('')}</div>
    ${R.map((r,i)=>{const isPick=r.s===m.pick;const ac=isPick?'var(--pos)':'transparent';const bg=isPick?'rgba(11,161,91,.08)':'transparent';return `<div style="display:grid;grid-template-columns:${gc};gap:9px;align-items:center;padding:9px 10px 9px 7px;border-radius:8px;border-left:3px solid ${ac};background:${bg}">
      <span class="mono" style="font-size:12px;color:#b1b6bf">${i+1}</span>
      <span class="mono" style="font-weight:700;font-size:15px;color:#16181D">${esc(r.s)}</span>
      <span class="mono" style="font-size:12px;color:#8A909C">${(r.p*100).toFixed(1)}%</span>
      <div style="display:flex;align-items:center;gap:9px"><span class="mono" style="font-weight:700;font-size:13px;color:${isPick?'var(--posInk)':'#16181D'}">${r.ev.toFixed(3)}</span><div style="flex:1;height:5px;background:rgba(20,23,28,.06);border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.round(r.ev/maxev*100)}%;background:${isPick?'var(--pos)':'#c7ccd3'};border-radius:99px"></div></div></div>
    </div>`;}).join('')}
    <div style="display:flex;gap:16px;margin-top:12px;font:500 11px 'Hanken Grotesk';color:#8A909C;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:var(--pos)"></span>our pick</span></div>
  </section>`;
}

function lockedCard(){
  return `<section class="card" style="padding:42px 26px;text-align:center">
    <div style="font-size:38px">🔒</div>
    <h3 class="bg" style="font-weight:700;font-size:22px;letter-spacing:-.01em;margin:14px 0 8px">Hidden until kick-off</h3>
    <p style="max-width:440px;margin:0 auto 20px;font:400 15px/1.65 'Hanken Grotesk';color:#565B66">The model's recommended scoreline and probabilities for this match publish the moment predictions lock at kick-off — kept out of the page until then, so nothing leaks early.</p>
    <a href="${esc(CFG.contact)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;font:700 14px 'Hanken Grotesk';padding:13px 22px;border-radius:12px;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent)">Want the picks before the whistle? Get in touch ›</a>
  </section>`;
}

// A club crest, sized. Falls back to nothing so the row still lines up if a badge is missing.
function crestImg(u,px){
  return u?`<img src="${esc(u)}" alt="" loading="lazy" style="width:${px}px;height:${px}px;object-fit:contain;flex:0 0 auto">`:'';
}
// Name match across systems (oddschecker vs Prode spellings) — first word is enough here.
function _same(a,b){
  const n=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]/g,'').trim();
  const A=n(a), B=n(b);
  return A===B || A.indexOf(B.split(' ')[0])>-1 || B.indexOf(A.split(' ')[0])>-1;
}

function title(){
  const T=DATA.title||{}, t=T.rows||[], top=t.length?t[0].p:1, C=DATA.champ||{};
  const market=T.source==='market';
  // The champion call is worth 6 pts and can be changed until Prode's own cut-off — that date
  // is the single most actionable thing on this page, so it sits at the top, not in a footnote.
  const deadline=C.until?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--acc) 7%,#fff);border-left:4px solid var(--acc);border-radius:10px;padding:11px 14px;margin:0 0 16px">
      <span style="font:700 11px 'Hanken Grotesk';letter-spacing:.1em;text-transform:uppercase;color:var(--accInk)">Editable until</span>
      <span class="mono" style="font-weight:700;font-size:14px;color:#16181D">${esc(C.until)}</span>
      <span style="font:500 12px 'Hanken Grotesk';color:#8A909C">— after this the champion pick locks</span>
    </div>`:'';
  const mine=C.name?`<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border-left:3px solid var(--pos);background:rgba(11,161,91,.07);margin:0 0 16px">
      ${crestImg(C.crest,30)||'<span style="font-size:24px">🏆</span>'}
      <div style="flex:1;min-width:0"><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.12em;text-transform:uppercase;color:#8A909C">Our champion pick</div>
      <div class="bg" style="font-weight:700;font-size:19px;color:var(--posInk)">${esc(C.name)}</div></div>
      <span class="mono" style="font-weight:700;font-size:13px;color:#8A909C">+6 pts</span>
    </div>`:'';
  const rows=t.map((x,i)=>{const isMine=C.name&&_same(x.team,C.name);const pct=x.p*100;
    const bc=isMine?'var(--pos)':'transparent', bg=isMine?'rgba(11,161,91,.07)':'', nc=isMine?'var(--posInk)':'#16181D';
    return `<div style="display:grid;grid-template-columns:22px 1fr 88px;gap:10px;align-items:center;padding:9px 10px 9px 7px;border-radius:8px;border-left:3px solid ${bc};${bg?`background:${bg}`:''}">
      <span class="mono" style="font-size:12px;color:#b1b6bf">${i+1}</span>
      <div style="display:flex;align-items:center;gap:9px;min-width:0">${crestImg(x.crest,20)}<span style="font:700 14px 'Hanken Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${nc}">${esc(x.team)}</span></div>
      <div style="display:flex;align-items:baseline;gap:10px;justify-content:flex-end">
        <span class="mono" style="font-weight:700;font-size:13px;color:#16181D;min-width:44px;text-align:right">${pct.toFixed(1)}%</span>
        ${x.ev!=null?`<span class="mono" style="font-weight:700;font-size:11px;color:${isMine?'var(--posInk)':'#b1b6bf'};min-width:28px;text-align:right">${x.ev.toFixed(2)}</span>`:''}
      </div></div>`;}).join('');
  const stamp=T.synced?`<div style="text-align:center;font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#b1b6bf;text-transform:uppercase;margin:14px 0 0">⟳ odds fetched ${esc(T.synced)} GST${T.vig!=null?` · book margin ${(T.vig*100).toFixed(1)}%`:''}</div>`:'';
  return header()+`<a href="#/" style="display:inline-flex;gap:7px;margin:24px 0 18px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> Matches</a>
    <section class="card" style="padding:24px clamp(16px,3vw,26px)">
      <h2 class="bg" style="font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0 0 3px">Title race</h2>
      <p style="font:500 13px 'Hanken Grotesk';color:#8A909C;margin:0 0 16px">${market?'Win probability from the posted outright market — best odds across the book, margin removed':'Model win probabilities for the trophy'} · favourite <b class="acc">${esc(t.length?t[0].team:'—')}</b></p>
      ${deadline}${mine}
      <div style="display:grid;grid-template-columns:22px 1fr 88px;gap:10px;padding:0 10px 9px;border-bottom:1px solid rgba(20,23,28,.08)">
        ${['#','Team','Win % · EV'].map((x,i)=>`<span style="font:600 9px 'Hanken Grotesk';letter-spacing:.09em;color:#b1b6bf;text-transform:uppercase;${i>1?'text-align:right':''}">${x}</span>`).join('')}
      </div>
      ${rows}${stamp}
    </section>`;
}

function about(){
  const eyebrow=t=>`<div style="font:600 11px 'Hanken Grotesk';letter-spacing:.16em;color:var(--accInk);text-transform:uppercase;margin:34px 0 10px">${t}</div>`;
  const h2=t=>`<h2 class="bg" style="font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0 0 12px">${t}</h2>`;
  const p=t=>`<p style="font:400 16px/1.7 'Hanken Grotesk';color:#565B66;margin:0 0 14px">${t}</p>`;
  const score=(n,l,d)=>`<div style="display:flex;align-items:baseline;gap:12px"><span class="bg" style="font-weight:800;font-size:30px;color:var(--accInk);line-height:1">${n}</span><div><div style="font:700 14px 'Hanken Grotesk'">${l}</div><div style="font:500 12px 'Hanken Grotesk';color:#8A909C;margin-top:2px">${d}</div></div></div>`;
  const uni=(CFG.universe||[]).map(x=>{const here=location.hostname&&x.u.indexOf(location.hostname)>-1;return `<a href="${here?'#/':x.u}"${here?'':' target="_blank" rel="noopener"'} class="card" style="display:flex;align-items:center;gap:14px;padding:15px 18px;margin:0 0 12px;${here?'border:1px solid var(--acc)':''}"><span class="flag" style="font-size:26px">${x.f}</span><div style="flex:1;min-width:0"><div class="bg" style="font-weight:700;font-size:16px">${esc(x.n)}</div><div style="font:500 12px 'Hanken Grotesk';color:#8A909C">${here?'You are here':'Open portal ›'}</div></div></a>`;}).join('');
  const total=DATA.summary?DATA.summary.total:380;
  return header()+`<div style="max-width:720px;margin:0 auto;animation:fadeIn .4s ease both">
    <a href="#/" style="display:inline-flex;gap:7px;margin:24px 0 6px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> Matches</a>
    <div style="font:600 11px 'Hanken Grotesk';letter-spacing:.2em;color:var(--accInk);text-transform:uppercase;margin:10px 0 8px">About</div>
    <h1 class="bg" style="font-weight:800;font-size:clamp(28px,5.5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px">xPoints — the points-optimal scoreline</h1>
    <p style="font:400 18px/1.6 'Hanken Grotesk';color:#565B66;margin:0 0 6px">For every match, the model works out the score that wins the most points on average — not the bravest guess, the smartest one. This portal runs it across <b>${esc(CFG.long)} ${esc(CFG.season)}</b>, all ${total} matches.</p>
    ${eyebrow('How points are scored')}
    <div class="card" style="padding:20px 22px;display:flex;gap:30px;flex-wrap:wrap;margin:0 0 6px">${score('3','Exact score','Right score and result')}${score('1','Right outcome','Right winner or draw')}</div>
    ${eyebrow('The idea')}
    ${h2('Being right beats being brave')}
    ${p('Prediction pools score a nervy 1-0 the same as a wild 4-3. So the winning move is not to be clever — it is to pick the single scoreline with the highest expected points, every time, and let the maths compound over a full season.')}
    ${p('Every pick is published the moment it exists — the recommended scoreline, its win-probability split, and the full grid of expected points behind it. Nothing is held back, so you can judge the calls against the results as the season runs.')}
    ${eyebrow('Where it started')}
    ${h2('Proven at the World Cup')}
    ${p('The model played its first season at the 2026 World Cup — one scoreline per match, chosen by the maths. It finished <b>first in its pool</b> and in the global <b>top 0.6%</b>. A World Cup is short, though; a league of ${total} matches is where an edge either shows up or gets exposed. That is the test now under way.'.replace('${total}',total))}
    ${eyebrow('The xPoints universe')}
    ${uni}
  </div>`;
}
// Last-refresh stamp: baked at build time, shown in the visitor's own
// timezone (the pre-formatted UTC string is the fallback). Rendered as the
// header's third line — the home page is long, so the bottom is never seen.
function stampText(){
  let s=DATA.generated;
  if(DATA.generated_iso){const t=new Date(DATA.generated_iso);
    if(!isNaN(t))s=t.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
  return s;
}
// Fixed bottom nav on mobile (hidden on desktop via CSS).
function bottombar(){
  const cur=route().v;
  const items=[['⚽','Matches','#/','home']];
  items.push(['🏆','Title race','#/title','title']);
  items.push(['📈','Ranking','#/rank','rank']);
  items.push(['📖','About','#/about','about']);
  return `<nav class="botnav">${items.map(([ic,l,h,v])=>{const on=cur===v||(v==='home'&&cur==='detail');return `<a href="${h}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:${on?'var(--accInk)':'#9aa0ab'};font:700 10px 'Hanken Grotesk';letter-spacing:.02em"><span style="font-size:19px;line-height:1">${ic}</span>${l}</a>`;}).join('')}</nav>`;
}
function render(){document.getElementById('app').innerHTML=({home:home,detail:()=>detail(route().id),title:title,rank:rankView,about:about}[route().v]())+bottombar();window.scrollTo(0,0);}
function toggleSw(){const d=document.getElementById('swdrop');if(d)d.style.display=d.style.display==='none'?'block':'none';}
document.addEventListener('click',()=>{const d=document.getElementById('swdrop');if(d)d.style.display='none';});
window.addEventListener('hashchange',render);
window.matchMedia('(max-width: 720px)').addEventListener('change',render); render();
</script></body></html>
