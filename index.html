              return `<a href="${href}" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;text-decoration:none;font:700 13px 'Hanken Grotesk';color:${on?'#fff':'#16181D'};background:${on?'var(--accInk)':'transparent'}"><span class="flag" style="display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-size:16px;line-height:1;flex:0 0 auto">${u.f}</span><span style="line-height:1.2">${esc(u.n)}</span></a>`;}).join('')}
          </div>
        </div>
        <div style="min-width:0"><div class="bg htitle" style="font-weight:800;font-size:22px;line-height:1.06;letter-spacing:-.02em">${esc(CFG.long)} ${esc(CFG.season.slice(2))}</div><div class="lab hkick" style="margin-top:6px;letter-spacing:.16em">Score Predictor Model</div><div class="hupd" style="margin-top:4px;color:#9aa0ab;font:600 10px 'Hanken Grotesk';letter-spacing:.03em">Updated ${stampText()}</div></div>
      </a>
      ${ptsBadge()}
    </div>
    <nav class="card navhide" style="display:flex;gap:3px;padding:4px;border-radius:12px;box-shadow:none">
      ${nav.map(([l,h,v])=>{const on=cur===v||(v==='home'&&cur==='detail');return `<a href="${h}" class="navi" style="${on?'background:var(--accInk);color:#fff':'color:#8A909C'}">${l}</a>`;}).join('')}
    </nav></header>`;
}

function countdown(){
  const start=new Date(CFG.starts+'T12:00:00Z'), ms=start-new Date();
  if(ms<=0) return 'Season under way';
  const d=Math.floor(ms/864e5);
  return `Kicks off ${new Date(CFG.starts+'T12:00:00Z').toLocaleDateString(undefined,{day:'numeric',month:'long'})} · ${d} day${d===1?'':'s'} to go`;
}

// HIS POSITION, in the header on every page (his call, 2026-10-26: points
// alone say nothing without a reference -- "80 pts" is good or bad only next
// to everyone else's; "#20 of 3,202" already carries the comparison). Points
// stay as the small line, and are the badge itself until Prode has scored a
// position. Just the position, no "of N" (his word); the field size is in
// the tooltip and on the Ranking tab. A tap opens the Ranking tab.
function ptsBadge(){
  const s=DATA.summary, c=(DATA.rank||{}).current;
  if(c&&c.position&&c.players){
    const n=Number(c.players).toLocaleString('en-US');
    return `<a class="ptsb" href="#/rank" title="#${c.position} of ${n} Prode players · ${c.points} pts · ${c.exacts} exact"><b>#${c.position}</b><span>${c.points} pts</span></a>`;
  }
  if(!s) return '';
  return `<a class="ptsb" href="#/rank" title="${s.played} of ${s.total} played · forecast ${s.forecast}"><b>${s.points}</b><span>pts</span></a>`;
}
function pipeline(m){
  const fetched = m.basis==='market';
  const placed  = !!m.placed;
  const match   = placed && !!m.pick && m.placed===m.pick;
  const whyNoOdds = m.csRead==='failed' ? 'our last read failed'
                  : m.csRead==='unchecked' ? 'not checked yet'
                  : 'no market posted yet';
  return [
    {label:'Odds fetched',    ok:fetched, why:fetched?(m.synced?'fetched '+m.synced+' GST':'posted market read'):whyNoOdds},
    {label:'Placed on Prode', ok:placed,  why:placed?('holds '+m.placed):'nothing entered'},
    {label:'Verified',        ok:match,   why:match?'entry matches the model pick'
                                             :(placed&&m.pick?('Prode '+m.placed+' ≠ model '+m.pick)
                                             :'waiting on steps 1–2')},
  ];
}

// A club crest is decoration only: if it fails to load it is HIDDEN, never
// replaced. The old fallback, a tri-code chip, doubled every club beside its
// own code ("ATH ATH v SEV SEV") whenever the crest CDN was slow or blocked.
// Hidden rather than removed, so the row keeps its shape and its time stays
// in line with the rows above and below.
function cr(logo,px){
  px=px||18;
  return logo?`<img src="${esc(logo)}" alt="" loading="lazy" class="crest" style="width:${px}px;height:${px}px" onerror="this.style.visibility='hidden'">`
             :`<span style="display:inline-block;width:${px}px;height:${px}px;flex:none"></span>`;
}

// WHAT A PLAYED MATCH EARNED, as the hub draws it: 3 exact (green), 1 right
// outcome (amber), 0 grey.
//   X  Prode played it outside its scheduled matchday, so it scores nothing
//      however right the pick was (its rules, section 3). A bare 0 there
//      reads as a scoring bug to anyone who knows the score.
function ptsPill(m){
  if(m.not_counted) return `<span class="pp p0" title="Played outside its matchday — Prode does not count it">X</span>`;
  if(m.pts==null) return `<span class="pp p0">–</span>`;
  return `<span class="pp p${m.pts>=3?3:m.pts>0?1:0}" title="${m.pts} point${m.pts===1?'':'s'}">${m.pts}</span>`;
}

// THE ROUND THE LEAGUE IS ON: the first with at least half its fixtures still
// to play. Half, not all: La Liga parks a deferred R1 game for weeks, and one
// straggler must not hold the tab on a round that is otherwise long over.
function nowRound(){
  const by={};
  DATA.matches.forEach(m=>{
    const r=by[m.roundNo]=by[m.roundNo]||{n:0,open:0};
    r.n++; if(m.status==='upcoming'||m.status==='live') r.open++;
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).find(k=>by[k].open*2>=by[k].n);
}
// An untimed fixture's koISO is a bare ':00Z', and Chrome's lenient parser
// turns even that into a date -- so only a real YYYY-MM-DD counts as a time.
const _t=m=>/^\d{4}-\d\d-\d\d/.test(m.koISO||'')?Date.parse(m.koISO):null;
// Ascending, the untimed last and in round order: a fixture Prode has not
// timed yet (a whole round can sit like that for a week) still comes after
// the ones it has.
// POSTPONED LAST (Prode's "Suspended", no new date): its kick-off is a date
// that will not happen, and sorted by it R8 Rayo v Athletic sat at the top of
// To come under 10 Oct, two weeks after the fact (his screenshot, 2026-10-26).
const _ppd=m=>m.status==='suspended';
const _asc=(a,b)=>{if(_ppd(a)!==_ppd(b)) return _ppd(a)?1:-1;
  const x=_t(a),y=_t(b);
  if(x!=null&&y!=null) return x-y||a.id-b.id;
  if(x!=null) return -1; if(y!=null) return 1;
  return a.roundNo-b.roundNo||a.mno-b.mno;};
const _desc=(a,b)=>(_t(b)||0)-(_t(a)||0)||b.id-a.id;

function tabLists(){
  const M=DATA.matches, nr=nowRound(), now=Date.now(), fin=m=>m.status==='finished';
  // THIS WEEK: the current round, anything in play, what kicks off in the
  // next seven days, and what finished in the last four -- last weekend's
  // results are the first thing anyone checks. To come first, then played,
  // newest first.
  const week=M.filter(m=>{const t=_t(m);
    return m.roundNo===nr||m.status==='live'
      ||(t!=null&&!_ppd(m)&&(fin(m)?now-t<4*864e5:t-now<7*864e5));});
  return {
    week: week.filter(m=>!fin(m)).sort(_asc).concat(week.filter(fin).sort(_desc)),
    played: M.filter(fin).sort(_desc),
    come: M.filter(m=>!fin(m)).sort(_asc),
    all: M.slice().sort(_asc)};
}

// Consecutive matches on one GST day share a heading; untimed ones are
// headed by their round, since a day is exactly what they do not have.
function dayGroups(list){
  const out=[]; let g=null;
  list.forEach(m=>{
    const k=_ppd(m)?'PPD':(m.kd||('R'+m.roundNo));
    if(!g||g.k!==k){g={k,label:_ppd(m)?'Postponed · no new date':(m.kd||('Matchweek '+m.roundNo+' · time not set')),ms:[]};out.push(g);}
    g.ms.push(m);});
  return out;
}

// ONE LINE PER MATCH: crests and clubs · kick-off · pick · result · a pill.
// Our pick always sits in the left score column and the result in the right
// one; the pill is the pick's expected points before kick-off and what it
// earned after. Clubs are tri-codes on a phone and full names on a desktop, where
// there is room for them.
function mrow(m){
  const nm=(c,n)=>esc(isMobile()?c:n);
  const fin=m.status==='finished', live=m.status==='live';
  const when=live?'<span class="lv">LIVE</span>'
    :m.status==='suspended'?'<span title="Postponed by Prode">PPD</span>'
    :(m.kt?esc(m.kt):'TBC');
  const said=m.placed||(m.revealed?m.pick:'');
  let cells,pill;
  if(fin||live){
    cells=`<b class="pk" title="our pick">${said?esc(said):'–'}</b><i class="ar">→</i><b class="rs${live?' lv':''}" title="${live?'in play':'result'}">${esc(m.result||'')}</b>`;
    pill=fin?ptsPill(m):'<span class="pp pl" title="In play — scores nothing yet">●</span>';
  }else if(m.revealed&&m.pick){
    cells=`<b class="pk" title="our pick">${esc(m.pick)}</b><i class="ar"></i><b class="rs"></b>`;
    pill=`<span class="pp pe" title="expected points">${m.ev!=null?m.ev.toFixed(2):'–'}</span>`;
  }else{
    cells=`<b class="pk nx" title="${m.locked?'hidden until kick-off':'no odds yet'}">?-?</b><i class="ar"></i><b class="rs"></b>`; pill='<span></span>';
  }
  return `<a class="mr" href="#/m/${m.id}"><span class="tm">${cr(m.hLogo,16)}<b>${nm(m.hC,m.hN)}</b><em>v</em><b>${nm(m.aC,m.aN)}</b>${cr(m.aLogo,16)}</span><span class="kt">${when}</span>${cells}${pill}</a>`;
}

function home(){
  const s=DATA.summary||{total:DATA.matches.length,rounds:CFG.rounds,played:0,points:0,forecast:0};
  const start=new Date(CFG.starts+'T12:00:00Z'), _ms=start-new Date();
  const _days=Math.max(0,Math.floor(_ms/864e5)), _live=_ms<=0||s.played>0;
  const _dstr=start.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'long'});
  // THE BANNER IS A COUNTDOWN, SO IT ENDS WHEN THE COUNTDOWN DOES: rendered
  // only while there is still something to count down to, gone on its own at
  // the season's start date.
  const cd=_live?'':`<section class="card" style="padding:18px 22px;margin:24px 0 14px;display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 9%,#fff),#fff);border-left:4px solid var(--acc)">
      <div style="text-align:center;flex:none;min-width:60px"><div class="bg" style="font-weight:800;font-size:38px;line-height:1;color:var(--accInk)">${_days}</div><div class="lab" style="margin-top:4px">days to go</div></div>
      <div style="flex:1;min-width:0"><div class="bg" style="font-weight:700;font-size:19px;letter-spacing:-.01em">${'Kicks off '+_dstr}</div><div style="font:500 13px 'Hanken Grotesk';color:#8A909C;margin-top:3px">${s.total} fixtures · ${s.rounds} matchweeks</div></div></section>`;
  const L=tabLists(), searching=q.length>0, byRound=round!=='ALL'&&!searching;
  // Search looks across the whole season and a chosen matchweek shows that
  // round whole; either one stands in for the tab, so no tab is lit while
  // it is on -- a lit tab over a list it did not make is a lie.
  let list;
  if(searching) list=DATA.matches.filter(m=>(m.hN+' '+m.aN+' '+m.hC+' '+m.aC).toLowerCase().includes(q)).sort(_asc);
  else if(byRound) list=DATA.matches.filter(m=>('R'+m.roundNo)===round).sort(_asc);
  else list=L[tab]||L.week;
  const T=[['week','This week'],['played','Played'],['come','To come'],['all','All']];
  const tabs=`<nav class="tabs">${T.map(([k,l])=>`<button onclick="setTab('${k}')" class="${!searching&&!byRound&&tab===k?'on':''}">${l} <i>${L[k].length}</i></button>`).join('')}</nav>`;
  const weekOpts=[`<option value="ALL"${round==='ALL'?' selected':''}>Matchweek</option>`].concat(DATA.rounds.map(r=>`<option value="${r.key}"${r.key===round?' selected':''}>Matchweek ${r.no}</option>`)).join('');
  const weekSelect=`<div class="wsel"><select onchange="pick(this.value)">${weekOpts}</select><span>▾</span></div>`;
  const box=`<div class="qbox"><input id="q" value="${esc(q)}" oninput="search(this.value)" placeholder="🔍  Search a club" autocomplete="off">${searching?`<span onclick="search('')">✕</span>`:''}</div>`;
  const body=list.length
    ? dayGroups(list).map(g=>`<div class="dh"><span>${esc(g.label)}</span><span>${g.ms.length} match${g.ms.length===1?'':'es'}</span></div>${g.ms.map(mrow).join('')}`).join('')
    : `<div class="card" style="padding:36px;text-align:center;color:#9aa0ab">No matches.</div>`;
  return header()+cd+`<div class="col">${tabs}<div class="tools">${box}${weekSelect}</div>${body}</div>`;
}

// Home / draw / away, the bar the site always had: 1 · X · 2 inside the
// segments and the percentages under them. Club names under the bar were
// tried for a day and cut to "Rayo Vallecano …" on a phone (his call,
// 2026-10-26: back to this).
function xbar(m){
  const o=m.out||{}, H=Math.round((o.HOME||0)*100), D=Math.round((o.DRAW||0)*100), A=Math.round((o.AWAY||0)*100);
  const seg=(w,c,t)=>`<div style="width:${w}%;background:${c};display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px 'JetBrains Mono',monospace">${w>=10?t:''}</div>`;
  return `<div style="margin:16px 0 0"><div style="display:flex;height:28px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(20,23,28,.06)">${seg(H,'var(--acc)','1')}${seg(D,'#9aa0ab','X')}${seg(A,'#3a4150','2')}</div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font:700 12px 'JetBrains Mono',monospace"><span class="acc">1 · ${H}%</span><span style="color:#8A909C">X · ${D}%</span><span style="color:#3a4150">2 · ${A}%</span></div>
  <div style="text-align:center;margin-top:4px" class="lab">Match result — win probability</div></div>`;
}

// KICK-OFF COUNTDOWN (his ask, 2026-10-26), on every match still to come,
// drawn the way the hub's match page draws it (40-shell.jsx PredMatchHero):
// "Today / Tomorrow / Tue 27 Oct · 00:00", a pill [Nd ]HH:MM:SS ticking every
// second, "to kick-off" under it. Updated in place, never by a re-render, so
// the page does not jump while it is being read.
function koCountdown(t){
  const left=Math.floor((t-Date.now())/1000);
  if(left<=0) return 'kick-off';
  const two=n=>String(n).padStart(2,'0'), d=Math.floor(left/86400);
  return (d?d+'d ':'')+two(Math.floor(left%86400/3600))+':'+two(Math.floor(left%3600/60))+':'+two(left%60);
}
function koDay(t,kd){
  const key=x=>new Date(x).toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'});
  return key(t)===key(Date.now())?'Today':key(t)===key(Date.now()+864e5)?'Tomorrow':kd;
}
setInterval(()=>document.querySelectorAll('.cdn').forEach(e=>{e.textContent=koCountdown(+e.dataset.ko);}),1000);

// THE MATCH PAGE (option A): one hero card -- the pick, or the result once
// it is played -- then the top five scorelines, the rest one tap away. The
// three-step pipeline card is folded into the chips and the footer line: the
// steps are still all said, just not as three circles of their own.
function detail(id){
  const m=byId(id); if(!m) return header()+'<p style="margin-top:30px">Not found. <a href="#/">Back</a></p>';
  const fin=m.status==='finished', live=m.status==='live', has=m.revealed&&!!m.pick;
  const dash=v=>esc(String(v).replace('-',' – '));
  const when=live?'<span class="lv">● Live</span>'
    :fin?'Full time'
    :m.status==='suspended'?'Postponed'
    :(_t(m)!=null?esc(koDay(_t(m),m.kd)+' · '+m.kt+' GST'):'Time not set yet');
  const said=m.placed||(has?m.pick:'');
  // THE CARD IS A SCOREBOARD, OUR PICK A STRIP UNDER IT (his pick A of three,
  // 2026-10-26). Crests with their names, and the middle is only ever the
  // match: kick-off and the countdown, the running score, the final score,
  // postponed. Our pick has one strip of its own on every match -- placed or
  // not, "?-?" without odds -- with its verdict beside it: expected points and
  // placement before kick-off, what it is scoring while live, what it scored.
  let mid;
  if(fin||live) mid=`<div class="sc${live?' lv':''}">${dash(m.result||'–')}</div>`;
  else if(m.status==='suspended') mid=`<div class="sc mute">– –</div><div class="cdl">no new date yet</div>`;
  else if(_t(m)!=null) mid=`<div class="cdn" data-ko="${_t(m)}">${koCountdown(_t(m))}</div><div class="cdl">to kick-off</div>`;
  else mid='';
  // what the pick earns: 3 exact, 1 the right outcome, else 0 (Prode's rule)
  const earn=(p,r)=>{if(!p||!r)return null;const [a,b]=p.split('-').map(Number),[x,y]=r.split('-').map(Number);
    return a===x&&b===y?3:Math.sign(a-b)===Math.sign(x-y)?1:0;};
  const badge=(n,live)=>`<span class="bdg b${n}">${live?'scoring '+(n?'+'+n:'0')+' now':n>=3?'Exact · +3':n>0?'Right result · +1':'Missed · 0'}</span>`;
  let right='';
  if(fin) right=m.not_counted?'<span class="bdg b0">not counted</span>':m.pts==null?'':badge(m.pts>=3?3:m.pts>0?1:0);
  else if(live) right=earn(said,m.result)==null?'':badge(earn(said,m.result),true);
  else if(has){
    right=`<span class="chp">${m.ev!=null?m.ev.toFixed(2):'–'} exp. pts</span>`;
    if(m.placed) right+=m.placed===m.pick?'<span class="chp ok">placed ✓</span>':`<span class="chp bad">placed ${esc(m.placed)} ≠ ${esc(m.pick)}</span>`;
    else if(m.open) right+='<span class="chp am">not placed</span>';
  }
  else right='<span class="nod">no odds yet</span>';
  const tm=(logo,name)=>`<div class="tm"><span class="hc">${cr(logo,56)}</span><b>${esc(name)}</b></div>`;
  const hero=`<section class="card hero">
    <div class="ga">${tm(m.hLogo,m.hN)}<div class="mid"><div class="when">${when}</div>${mid}</div>${tm(m.aLogo,m.aN)}</div>
    <div class="strip"><span class="lab2">Our pick</span><b class="pk${said?'':' nx'}">${said?esc(said):'?-?'}</b><span class="sp"></span>${right}</div>
    ${m.revealed?xbar(m):''}</section>`;
  const odds=pipeline(m)[0];
  const foot=`<div class="foot">${odds.ok&&m.synced?'⟳ odds read '+esc(m.synced)+' GST':'odds: '+esc(odds.why)}</div>`;
  const back=`<a href="#/" class="back"><span>‹</span> Matchweek ${m.roundNo}</a>`;
  const wrap=x=>header()+`<div class="narrow">${back}${hero}${x}</div>`;
  if(m.revealed) return wrap(topPicks(m)+foot);
  if(m.missing) return wrap(`<section class="card" style="padding:30px;text-align:center;color:#8A909C"><p style="max-width:420px;margin:0 auto;line-height:1.6">No odds published for this fixture yet, so there is no pick to show. It appears here as soon as a market opens.</p></section>`+foot);
  if(m.locked) return wrap(lockedCard());
  return wrap(`<section class="card" style="padding:34px;text-align:center;color:#8A909C"><div style="font-size:32px">🗓️</div><p style="max-width:420px;margin:12px auto 0;line-height:1.6">This matchweek isn't open yet. The model publishes its pick and probabilities once the round's odds are live.</p></section>`);
}

// Every scoreline ranked by expected points (P(score), the EV, a bar) -- the
// top five, and the rest of the ranking one tap away.
function topPicks(m){
  const R=m.ranked||[];
  if(!R.length) return '';
  const max=Math.max(...R.map(r=>r.ev)), shown=allRanked?R:R.slice(0,5);
  return `<section class="card tp"><div class="tph"><b>Top picks</b><span>exp. points</span></div>
    ${shown.map((r,i)=>`<div class="tr${r.s===m.pick?' me':''}"><span>${i+1}</span><b>${esc(r.s)}</b><span>${(r.p*100).toFixed(1)}%</span><i><u style="width:${Math.round(r.ev/max*100)}%"></u></i><em>${r.ev.toFixed(3)}</em></div>`).join('')}
    ${R.length>5?`<button class="more" onclick="toggleRanked()">${allRanked?'Top 5 only':'All '+R.length+' scorelines ›'}</button>`:''}</section>`;
}

function lockedCard(){
  return `<section class="card" style="padding:42px 26px;text-align:center">
    <div style="font-size:38px">🔒</div>
    <h3 class="bg" style="font-weight:700;font-size:22px;letter-spacing:-.01em;margin:14px 0 8px">Hidden until kick-off</h3>
    <p style="max-width:440px;margin:0 auto 20px;font:400 15px/1.65 'Hanken Grotesk';color:#565B66">The model's recommended scoreline and probabilities for this match publish the moment predictions lock at kick-off — kept out of the page until then, so nothing leaks early.</p>
    <a href="${esc(CFG.contact)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;font:700 14px 'Hanken Grotesk';padding:13px 22px;border-radius:12px;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent)">Want the picks before the whistle? Get in touch ›</a>
  </section>`;
}

// A club crest, sized. Falls back to nothing so the row still lines up if a badge is missing.
function crestImg(u,px){
  return u?`<img src="${esc(u)}" alt="" loading="lazy" style="width:${px}px;height:${px}px;object-fit:contain;flex:0 0 auto">`:'';
}
// Name match across systems (oddschecker vs Prode spellings) — first word is enough here.
function _same(a,b){
  const n=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]/g,'').trim();
  const A=n(a), B=n(b);
  return A===B || A.indexOf(B.split(' ')[0])>-1 || B.indexOf(A.split(' ')[0])>-1;
}

function title(){
  const T=DATA.title||{}, t=T.rows||[], top=t.length?t[0].p:1, C=DATA.champ||{};
  const market=T.source==='market';
  // The champion call is worth 6 pts and can be changed until Prode's own cut-off — that date
  // is the single most actionable thing on this page, so it sits at the top, not in a footnote.
  const deadline=C.until?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--acc) 7%,#fff);border-left:4px solid var(--acc);border-radius:10px;padding:11px 14px;margin:0 0 16px">
      <span style="font:700 11px 'Hanken Grotesk';letter-spacing:.1em;text-transform:uppercase;color:var(--accInk)">Editable until</span>
      <span class="mono" style="font-weight:700;font-size:14px;color:#16181D">${esc(C.until)}</span>
      <span style="font:500 12px 'Hanken Grotesk';color:#8A909C">— after this the champion pick locks</span>
    </div>`:'';
  const mine=C.name?`<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border-left:3px solid var(--pos);background:rgba(11,161,91,.07);margin:0 0 16px">
      ${crestImg(C.crest,30)||'<span style="font-size:24px">🏆</span>'}
      <div style="flex:1;min-width:0"><div style="font:600 10px 'Hanken Grotesk';letter-spacing:.12em;text-transform:uppercase;color:#8A909C">Our champion pick</div>
      <div class="bg" style="font-weight:700;font-size:19px;color:var(--posInk)">${esc(C.name)}</div></div>
      <span class="mono" style="font-weight:700;font-size:13px;color:#8A909C">+6 pts</span>
    </div>`:'';
  const rows=t.map((x,i)=>{const isMine=C.name&&_same(x.team,C.name);const pct=x.p*100;
    const bc=isMine?'var(--pos)':'transparent', bg=isMine?'rgba(11,161,91,.07)':'', nc=isMine?'var(--posInk)':'#16181D';
    return `<div style="display:grid;grid-template-columns:22px 1fr 88px;gap:10px;align-items:center;padding:9px 10px 9px 7px;border-radius:8px;border-left:3px solid ${bc};${bg?`background:${bg}`:''}">
      <span class="mono" style="font-size:12px;color:#b1b6bf">${i+1}</span>
      <div style="display:flex;align-items:center;gap:9px;min-width:0">${crestImg(x.crest,20)}<span style="font:700 14px 'Hanken Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${nc}">${esc(x.team)}</span></div>
      <div style="display:flex;align-items:baseline;gap:10px;justify-content:flex-end">
        <span class="mono" style="font-weight:700;font-size:13px;color:#16181D;min-width:44px;text-align:right">${pct.toFixed(1)}%</span>
        ${x.ev!=null?`<span class="mono" style="font-weight:700;font-size:11px;color:${isMine?'var(--posInk)':'#b1b6bf'};min-width:28px;text-align:right">${x.ev.toFixed(2)}</span>`:''}
      </div></div>`;}).join('');
  const stamp=T.synced?`<div style="text-align:center;font:600 10px 'Hanken Grotesk';letter-spacing:.1em;color:#b1b6bf;text-transform:uppercase;margin:14px 0 0">⟳ odds fetched ${esc(T.synced)} GST${T.vig!=null?` · book margin ${(T.vig*100).toFixed(1)}%`:''}</div>`:'';
  return header()+`<a href="#/" style="display:inline-flex;gap:7px;margin:24px 0 18px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> Matches</a>
    <section class="card" style="padding:24px clamp(16px,3vw,26px)">
      <h2 class="bg" style="font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0 0 3px">Title race</h2>
      <p style="font:500 13px 'Hanken Grotesk';color:#8A909C;margin:0 0 16px">${market?'Win probability from the posted outright market — best odds across the book, margin removed':'Model win probabilities for the trophy'} · favourite <b class="acc">${esc(t.length?t[0].team:'—')}</b></p>
      ${deadline}${mine}
      <div style="display:grid;grid-template-columns:22px 1fr 88px;gap:10px;padding:0 10px 9px;border-bottom:1px solid rgba(20,23,28,.08)">
        ${['#','Team','Win % · EV'].map((x,i)=>`<span style="font:600 9px 'Hanken Grotesk';letter-spacing:.09em;color:#b1b6bf;text-transform:uppercase;${i>1?'text-align:right':''}">${x}</span>`).join('')}
      </div>
      ${rows}${stamp}
    </section>`;
}

function about(){
  const eyebrow=t=>`<div style="font:600 11px 'Hanken Grotesk';letter-spacing:.16em;color:var(--accInk);text-transform:uppercase;margin:34px 0 10px">${t}</div>`;
  const h2=t=>`<h2 class="bg" style="font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0 0 12px">${t}</h2>`;
  const p=t=>`<p style="font:400 16px/1.7 'Hanken Grotesk';color:#565B66;margin:0 0 14px">${t}</p>`;
  const score=(n,l,d)=>`<div style="display:flex;align-items:baseline;gap:12px"><span class="bg" style="font-weight:800;font-size:30px;color:var(--accInk);line-height:1">${n}</span><div><div style="font:700 14px 'Hanken Grotesk'">${l}</div><div style="font:500 12px 'Hanken Grotesk';color:#8A909C;margin-top:2px">${d}</div></div></div>`;
  const uni=(CFG.universe||[]).map(x=>{const here=location.hostname&&x.u.indexOf(location.hostname)>-1;return `<a href="${here?'#/':x.u}"${here?'':' target="_blank" rel="noopener"'} class="card" style="display:flex;align-items:center;gap:14px;padding:15px 18px;margin:0 0 12px;${here?'border:1px solid var(--acc)':''}"><span class="flag" style="font-size:26px">${x.f}</span><div style="flex:1;min-width:0"><div class="bg" style="font-weight:700;font-size:16px">${esc(x.n)}</div><div style="font:500 12px 'Hanken Grotesk';color:#8A909C">${here?'You are here':'Open portal ›'}</div></div></a>`;}).join('');
  const total=DATA.summary?DATA.summary.total:380;
  return header()+`<div style="max-width:720px;margin:0 auto;animation:fadeIn .4s ease both">
    <a href="#/" style="display:inline-flex;gap:7px;margin:24px 0 6px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> Matches</a>
    <div style="font:600 11px 'Hanken Grotesk';letter-spacing:.2em;color:var(--accInk);text-transform:uppercase;margin:10px 0 8px">About</div>
    <h1 class="bg" style="font-weight:800;font-size:clamp(28px,5.5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px">${esc(CFG.long)} ${esc(CFG.season)} — the points-optimal scoreline</h1>
    <p style="font:400 18px/1.6 'Hanken Grotesk';color:#565B66;margin:0 0 6px">For every match, the model works out the score that wins the most points on average — not the bravest guess, the smartest one. This portal runs it across <b>${esc(CFG.long)} ${esc(CFG.season)}</b>, all ${total} matches.</p>
    ${eyebrow('How points are scored')}
    <div class="card" style="padding:20px 22px;display:flex;gap:30px;flex-wrap:wrap;margin:0 0 6px">${score('3','Exact score','Right score and result')}${score('1','Right outcome','Right winner or draw')}</div>
    ${eyebrow('The idea')}
    ${h2('Being right beats being brave')}
    ${p('Prediction pools score a nervy 1-0 the same as a wild 4-3. So the winning move is not to be clever — it is to pick the single scoreline with the highest expected points, every time, and let the maths compound over a full season.')}
    ${p('Every pick is published the moment it exists — the recommended scoreline, its win-probability split, and the full grid of expected points behind it. Nothing is held back, so you can judge the calls against the results as the season runs.')}
    ${eyebrow('Where it started')}
    ${h2('Proven at the World Cup')}
    ${p('The model played its first season at the 2026 World Cup — one scoreline per match, chosen by the maths. It finished <b>first in its pool</b> and in the global <b>top 0.6%</b>. A World Cup is short, though; a league of ${total} matches is where an edge either shows up or gets exposed. That is the test now under way.'.replace('${total}',total))}
    ${eyebrow('The xPoints universe')}
    ${uni}
  </div>`;
}
// Last-refresh stamp: baked at build time, shown in the visitor's own
// timezone (the pre-formatted UTC string is the fallback). Rendered as the
// header's third line — the home page is long, so the bottom is never seen.
function stampText(){
  let s=DATA.generated;
  if(DATA.generated_iso){const t=new Date(DATA.generated_iso);
    if(!isNaN(t))s=t.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
  return s;
}
// Fixed bottom nav on mobile (hidden on desktop via CSS).
function bottombar(){
  const cur=route().v;
  const items=[['⚽','Matches','#/','home']];
  items.push(['🏆','Title race','#/title','title']);
  items.push(['📈','Ranking','#/rank','rank']);
  items.push(['📖','About','#/about','about']);
  return `<nav class="botnav">${items.map(([ic,l,h,v])=>{const on=cur===v||(v==='home'&&cur==='detail');return `<a href="${h}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:${on?'var(--accInk)':'#9aa0ab'};font:700 10px 'Hanken Grotesk';letter-spacing:.02em"><span style="font-size:19px;line-height:1">${ic}</span>${l}</a>`;}).join('')}</nav>`;
}
function render(keep){document.getElementById('app').innerHTML=({home:home,detail:()=>detail(route().id),title:title,rank:rankView,about:about}[route().v]())+bottombar();if(!keep)window.scrollTo(0,0);}
function toggleSw(){const d=document.getElementById('swdrop');if(d)d.style.display=d.style.display==='none'?'block':'none';}
document.addEventListener('click',()=>{const d=document.getElementById('swdrop');if(d)d.style.display='none';});
// THE PHONE HEADER SHRINKS ON SCROLL (his ask, 2026-10-26). Two thresholds,
// not one: shrinking the header moves the page, and a single line would make
// it flicker back and forth across itself.
let _shrunk=false;
window.addEventListener('scroll',()=>{const y=window.scrollY,sh=_shrunk?y>10:y>60;if(sh!==_shrunk){_shrunk=sh;document.body.classList.toggle('shrunk',sh);}},{passive:true});
window.addEventListener('hashchange',()=>{allRanked=false;render();});
window.matchMedia('(max-width: 720px)').addEventListener('change',render); render();
</script></body></html>
